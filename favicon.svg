<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E24B4A"/>
      <stop offset="100%" style="stop-color:#b02f2e"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ffcccc;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bg)"/>

  <!-- Screen / image frame -->
  <rect x="10" y="10" width="44" height="30" rx="4" ry="4" fill="rgba(0,0,0,0.25)"/>

  <!-- Play triangle inside screen -->
  <polygon points="24,16 24,34 42,25" fill="white" opacity="0.9"/>

  <!-- Download arrow stem - animated bounce -->
  <rect x="29" y="44" width="6" height="10" rx="2" fill="url(#arrow)">
    <animate attributeName="y" values="44;46;44" dur="1.2s" repeatCount="indefinite" calcMode="ease-in-out"/>
  </rect>

  <!-- Download arrow head -->
  <polygon points="22,50 32,60 42,50" fill="url(#arrow)">
    <animate attributeName="points" values="22,50 32,60 42,50;22,52 32,62 42,52;22,50 32,60 42,50" dur="1.2s" repeatCount="indefinite" calcMode="ease-in-out"/>
  </polygon>

  <!-- Underline bar -->
  <rect x="16" y="58" width="32" height="3.5" rx="1.75" fill="white" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
